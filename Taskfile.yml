version: '3'

vars:
  CONFIG_FILE: config.kbd
  FLAGS: ''
  # Linux: user config read by a systemd user unit. macOS: root-readable config read by a LaunchDaemon.
  LINUX_CONFIG_DIR: $HOME/.config/kanata
  MACOS_CONFIG_DIR: /etc/kanata
  PLIST_LABEL: dev.kanata.kanata
  PLIST_PATH: /Library/LaunchDaemons/dev.kanata.kanata.plist

tasks:
  check:
    desc: Validate config syntax
    cmds:
      - kanata --cfg {{.CONFIG_FILE}} --check

  run:
    desc: Stop the service and run kanata in the foreground (Linux reloads on save)
    cmds:
      - task: stop
      - defer: { task: start }
      - cmd: ls {{.CONFIG_FILE}} | entr -r kanata --cfg {{.CONFIG_FILE}} {{.FLAGS}}
        platforms: [linux]
      - cmd: sudo kanata --cfg {{.CONFIG_FILE}} {{.FLAGS}}
        platforms: [darwin]

  debug:
    desc: Same as run, with debug logging (prints the key codes deflocalkeys needs)
    cmds:
      - task: run
        vars: { FLAGS: --debug }

  install:
    desc: Install the config and the service, then start it
    cmds:
      - cmd: |
          mkdir -p {{.LINUX_CONFIG_DIR}} $HOME/.config/systemd/user
          test -f {{.LINUX_CONFIG_DIR}}/{{.CONFIG_FILE}} && cp {{.LINUX_CONFIG_DIR}}/{{.CONFIG_FILE}} {{.LINUX_CONFIG_DIR}}/{{.CONFIG_FILE}}.bak-$(date +%Y-%m-%dT%H%M%S) || true
          cp {{.CONFIG_FILE}} {{.LINUX_CONFIG_DIR}}/
          cp kanata.service $HOME/.config/systemd/user/
          systemctl --user daemon-reload
          systemctl --user enable kanata.service
        platforms: [linux]
      - cmd: |
          sudo mkdir -p {{.MACOS_CONFIG_DIR}}
          sudo cp {{.CONFIG_FILE}} {{.MACOS_CONFIG_DIR}}/
          sudo cp kanata.plist {{.PLIST_PATH}}
          sudo chown root:wheel {{.PLIST_PATH}}
          sudo launchctl bootout system/{{.PLIST_LABEL}} 2>/dev/null || true
        platforms: [darwin]
      - task: start

  start:
    desc: Start or restart the service
    cmds:
      - cmd: systemctl --user restart kanata.service
        platforms: [linux]
      - cmd: sudo launchctl bootstrap system {{.PLIST_PATH}} 2>/dev/null || sudo launchctl kickstart -k system/{{.PLIST_LABEL}}
        platforms: [darwin]

  stop:
    desc: Stop the service
    ignore_error: true
    cmds:
      - cmd: systemctl --user stop kanata.service
        platforms: [linux]
      - cmd: sudo launchctl bootout system/{{.PLIST_LABEL}}
        platforms: [darwin]

  status:
    desc: Show service status
    cmds:
      - cmd: systemctl --user status kanata.service
        platforms: [linux]
      - cmd: sudo launchctl print system/{{.PLIST_LABEL}}
        platforms: [darwin]

  logs:
    desc: Follow service logs
    cmds:
      - cmd: journalctl --user -u kanata.service -f
        platforms: [linux]
      - cmd: sudo tail -f /var/log/kanata.log
        platforms: [darwin]

  clean:
    desc: Remove config backups (Linux)
    cmds:
      - cmd: rm -f {{.LINUX_CONFIG_DIR}}/{{.CONFIG_FILE}}.bak-*
        platforms: [linux]
